# ---------------------------------------------------------------------------
# Nginx site config for the Contigo Care landing page.
#
# Where this file goes on the server:
#   /etc/nginx/sites-available/contigo.care
# Then link it:
#   sudo ln -s /etc/nginx/sites-available/contigo.care /etc/nginx/sites-enabled/
#
# NOTE: This is the plain HTTP (port 80) version. Install it first, then run
# Certbot. Certbot edits this file for you: it adds the HTTPS server block on
# port 443 and turns this block into a redirect to HTTPS. You do not need to
# write the SSL parts by hand.
# ---------------------------------------------------------------------------

# Send www.contigo.care to contigo.care so the site has one address only.
server {
    listen 80;
    listen [::]:80;

    server_name www.contigo.care;

    return 301 http://contigo.care$request_uri;
}

server {
    listen 80;
    listen [::]:80;

    server_name contigo.care;

    # Folder that holds the built files (the contents of `dist`).
    root /var/www/contigo.care;
    index index.html;

    # Do not tell the world which nginx version we run.
    server_tokens off;

    # ---------------------------------------------------------------------
    # Compression: makes the JS and CSS much smaller over the network.
    # ---------------------------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        image/svg+xml
        font/woff2;

    # ---------------------------------------------------------------------
    # Basic security headers.
    # ---------------------------------------------------------------------
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ---------------------------------------------------------------------
    # Main rule.
    #
    # This is a single page app with client side routing (`/` and
    # `/privacidad`). If someone opens https://contigo.care/privacidad
    # directly, there is no file with that name on disk. `try_files` looks for
    # the file, then a folder, and if neither exists it serves index.html so
    # React can show the right page. Without this line you get a 404.
    # ---------------------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ---------------------------------------------------------------------
    # Hashed build files (/assets/index-a1b2c3d4.js and friends).
    # The file name changes on every build, so the browser can keep them
    # forever. This makes repeat visits very fast.
    # ---------------------------------------------------------------------
    location /assets/ {
        access_log off;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # ---------------------------------------------------------------------
    # index.html must never be cached. It is the file that points to the new
    # hashed assets, so if a browser caches it your users keep seeing the old
    # site after you deploy.
    # ---------------------------------------------------------------------
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires 0;
    }

    # Images and fonts sitting in the root (favicon.png, logos, and so on).
    location ~* \.(png|jpg|jpeg|gif|svg|ico|webp|woff2?)$ {
        access_log off;
        expires 30d;
        add_header Cache-Control "public";
    }

    # Do not serve hidden files such as .env or .git.
    location ~ /\. {
        deny all;
    }

    # Logs for this site only, easier to read than the shared ones.
    access_log /var/log/nginx/contigo.care.access.log;
    error_log  /var/log/nginx/contigo.care.error.log;
}
